<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>校園電視台綜合管理平台 (Supabase 版)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --sidebar-width: 260px;
      --primary-color: #1e293b; 
      --accent-color: #0ea5e9;  
      --success-color: #10b981; 
      --danger-color: #ef4444;   
      --warning-color: #f59e0b;  
      --bg-light: #f8fafc;
      --border-radius-lg: 16px;
      --border-radius-md: 12px;
      --transition-base: all 0.25s ease-in-out;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-light); color: #334155; }
    #loading-mask { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(8px); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background-color: var(--primary-color); color: #fff; z-index: 1040; display: flex; flex-direction: column; }
    .main-content { margin-left: var(--sidebar-width); padding: 40px; min-height: 100vh; }
    .sidebar-brand { padding: 24px 20px; font-size: 1.35rem; font-weight: 700; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-menu a { display: flex; align-items: center; padding: 14px 24px; color: #94a3b8; text-decoration: none; cursor: pointer; font-weight: 500; }
    .sidebar-menu a:hover, .sidebar-menu a.active { background-color: rgba(255, 255, 255, 0.05); color: #fff; border-left: 4px solid var(--accent-color); }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .card-modern { background: white; border-radius: var(--border-radius-lg); border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.02); }
    @media (max-width: 991.98px) {
      .sidebar { transform: translateX(-100%); }
      .main-content { margin-left: 0; padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- 電腦版側邊欄 -->
  <div class="sidebar">
    <div class="sidebar-brand"><i class="fa-solid fa-tv me-2 text-info"></i>校園電視台 (Supabase)</div>
    <div class="sidebar-menu">
      <a id="menu-login" onclick="switchView('login-view')" class="active"><i class="fa-solid fa-right-to-bracket me-2"></i>帳號驗證登入</a>
      <a id="menu-register" onclick="switchView('register-view')"><i class="fa-solid fa-user-plus me-2"></i>新成員申請註冊</a>
      <a id="menu-dashboard" onclick="switchView('member-dashboard-view')"><i class="fa-solid fa-chart-line me-2"></i>個人專屬檔案</a>
      <a id="menu-duty" onclick="switchView('duty-table-view')"><i class="fa-solid fa-calendar-check me-2"></i>活動值日簽到</a>
      <a id="menu-borrow" onclick="switchView('borrow-view')"><i class="fa-solid fa-toolbox me-2"></i>器材借用綜合表</a>
      <a id="menu-leave" onclick="switchView('leave-view')"><i class="fa-solid fa-user-clock me-2"></i>成員線上請假申請</a>
      <a id="menu-admin" onclick="switchView('admin-panel-view')" style="border-top: 1px solid rgba(255,255,255,0.1);"><i class="fa-solid fa-user-shield me-2"></i>高階管理控制台</a>
    </div>
  </div>

  <!-- 全域 Loading 遮罩 -->
  <div id="loading-mask" style="display:none;">
    <div class="spinner-border text-info" role="status"></div>
    <span class="mt-3 fw-bold text-secondary">Supabase 資料傳輸中...</span>
  </div>

  <!-- 主內容區 -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
      <h3 id="page-title" class="fw-bold mb-0">歡迎登入系統</h3>
      <div class="d-flex gap-2 align-items-center">
        <span id="user-tag" class="badge bg-dark p-2" style="display:none;"></span>
        <button id="logout-btn" class="btn btn-danger btn-sm" onclick="logout()" style="display:none;">登出</button>
      </div>
    </div>

    <!-- 1. 登入視圖 -->
    <div id="login-view" class="view-section active">
      <div class="row justify-content-center pt-3">
        <div class="col-12 col-md-6">
          <div class="card-modern p-5 text-center">
            <h4 class="fw-bold mb-4"> Supabase 身分驗證</h4>
            <form onsubmit="handleLoginSubmit(event)">
              <input type="text" id="login-id" class="form-control mb-3" placeholder="學號" required>
              <input type="password" id="login-pwd" class="form-control mb-4" placeholder="密碼" required>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">登入系統</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 註冊視圖 -->
    <div id="register-view" class="view-section">
      <div class="card-modern p-4">
        <h4 class="fw-bold mb-4">新成員申請註冊</h4>
        <form onsubmit="handleRegister(event)">
          <div class="row g-3">
            <div class="col-md-6"><input type="text" id="reg-id" class="form-control" placeholder="學號" required></div>
            <div class="col-md-6"><input type="password" id="reg-pwd" class="form-control" placeholder="密碼" required></div>
            <div class="col-md-4"><input type="text" id="reg-name" class="form-control" placeholder="姓名" required></div>
            <div class="col-md-4"><input type="text" id="reg-class" class="form-control" placeholder="班級 (例: s1r01)" required></div>
            <div class="col-md-4"><input type="tel" id="reg-phone" class="form-control" placeholder="電話" required></div>
            <div class="col-md-4"><input type="text" id="reg-pname" class="form-control" placeholder="家長姓名" required></div>
            <div class="col-md-4"><input type="text" id="reg-prel" class="form-control" placeholder="關係" required></div>
            <div class="col-md-4"><input type="tel" id="reg-pphone" class="form-control" placeholder="家長電話" required></div>
            <div class="col-12">
              <label class="form-label fw-bold">上傳個人照片</label>
              <input type="file" id="reg-photo" class="form-control" accept="image/*" required>
            </div>
          </div>
          <button type="submit" class="btn btn-success w-100 mt-4 py-2">提交註冊</button>
        </form>
      </div>
    </div>

    <!-- 3. 個人儀表板 -->
    <div id="member-dashboard-view" class="view-section">
      <div id="member-dashboard-content" class="card-modern p-4">
        <h4 id="m-name" class="fw-bold">--</h4>
        <p id="m-class" class="text-muted">--</p>
        <div class="row g-3 text-center my-3">
          <div class="col-md-3"><div class="p-3 border rounded">研習時數: <span id="stat-learn" class="fw-bold text-primary">0</span></div></div>
          <div class="col-md-3"><div class="p-3 border rounded">值日次數: <span id="stat-activity" class="fw-bold text-success">0</span></div></div>
          <div class="col-md-3"><div class="p-3 border rounded">參賽次數: <span id="stat-contest" class="fw-bold text-warning">0</span></div></div>
          <div class="col-md-3"><div class="p-3 border rounded">專業技能: <span id="stat-skills" class="fw-bold text-info">0</span></div></div>
        </div>
      </div>
    </div>

    <!-- 4. 活動值日大廳 -->
    <div id="duty-table-view" class="view-section">
      <div class="card-modern p-4">
        <h5 class="fw-bold mb-3">活動值日排班表</h5>
        <table class="table align-middle">
          <thead><tr><th>日期</th><th>活動名稱</th><th>負責人</th><th>拍攝人員</th><th>剪輯</th></tr></thead>
          <tbody id="duty-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- 5. 器材借用 -->
    <div id="borrow-view" class="view-section">
      <div class="card-modern p-4">
        <h5 class="fw-bold mb-3">器材借用登記</h5>
        <button class="btn btn-success mb-3" onclick="openBorrowModal()">新增借用登記</button>
        <table class="table align-middle">
          <thead><tr><th>借用人</th><th>單位</th><th>器材</th><th>日期</th><th>時長</th></tr></thead>
          <tbody id="borrowRecordsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 6. 管理員主控台 -->
    <div id="admin-panel-view" class="view-section">
      <div class="card-modern p-4">
        <h5 class="fw-bold mb-3">高階管理控制台</h5>
        <table class="table table-hover">
          <thead><tr><th>學號</th><th>姓名</th><th>班級</th><th>權限</th><th>操作</th></tr></thead>
          <tbody id="admin-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- 7. 請假中心 -->
    <div id="leave-view" class="view-section">
      <div class="card-modern p-4">
        <h5 class="fw-bold mb-3">線上請假申請</h5>
        <form onsubmit="handleLeaveSubmit(event)">
          <input type="text" id="leave-name" class="form-control mb-2" readonly placeholder="登入後自動帶入">
          <select id="leave-type" class="form-select mb-2" required>
            <option value="事假">事假</option>
            <option value="病假">病假</option>
          </select>
          <textarea id="leave-reason" class="form-control mb-3" placeholder="請假事由" required></textarea>
          <button type="submit" class="btn btn-warning w-100">提交請假單</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    // ===== 1. Supabase 初始化 =====
    const SUPABASE_URL = 'https://ogcjksialzmrsmtucalb.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_qz-26TtYcNN4zGQPJA37gA_QJYKsTDW';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // UI 切換
    function switchView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      if (viewId === 'duty-table-view') loadDuties();
      if (viewId === 'borrow-view') loadBorrows();
      if (viewId === 'admin-panel-view') loadAdminPanel();
    }

    function showLoading(show) {
      document.getElementById('loading-mask').style.display = show ? 'flex' : 'none';
    }

    // ===== 2. 用戶登入 =====
    async function handleLoginSubmit(e) {
      e.preventDefault();
      showLoading(true);
      const studentId = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-pwd').value.trim();

      const { data, error } = await supabase
        .from('members')
        .select('*')
        .eq('student_id', studentId)
        .eq('password', password)
        .single();

      showLoading(false);

      if (error || !data) {
        alert('學號或密碼錯誤！');
        return;
      }

      if (data.role === 'pending') {
        alert('您的帳號正在等待管理員審批，請稍後再試！');
        return;
      }

      currentUser = data;
      document.getElementById('user-tag').innerText = `${data.name} (${data.role})`;
      document.getElementById('user-tag').style.display = 'inline-block';
      document.getElementById('logout-btn').style.display = 'inline-block';

      // 更新儀表板
      document.getElementById('m-name').innerText = data.name;
      document.getElementById('m-class').innerText = data.class_name;
      document.getElementById('stat-learn').innerText = data.portfolio.learnHours || 0;
      document.getElementById('stat-activity').innerText = data.portfolio.activityHours || 0;
      document.getElementById('stat-contest').innerText = data.portfolio.contests || 0;
      document.getElementById('stat-skills').innerText = data.portfolio.skills || 0;
      document.getElementById('leave-name').value = data.name;

      switchView('member-dashboard-view');
    }

    function logout() {
      currentUser = null;
      location.reload();
    }

    // ===== 3. 成員註冊 + 照片上傳 =====
    async function handleRegister(e) {
      e.preventDefault();
      showLoading(true);

      const studentId = document.getElementById('reg-id').value.trim();
      const fileInput = document.getElementById('reg-photo');
      let photoUrl = 'https://via.placeholder.com/150';

      // 上傳圖片至 Supabase Storage
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const filePath = `${studentId}_${Date.now()}.${file.name.split('.').pop()}`;
        const { data: uploadData, error: uploadErr } = await supabase.storage
          .from('member-photos')
          .upload(filePath, file);

        if (!uploadErr) {
          const { data: publicUrlData } = supabase.storage.from('member-photos').getPublicUrl(filePath);
          photoUrl = publicUrlData.publicUrl;
        }
      }

      const newMember = {
        student_id: studentId,
        password: document.getElementById('reg-pwd').value,
        role: 'pending',
        name: document.getElementById('reg-name').value,
        class_name: document.getElementById('reg-class').value,
        phone: document.getElementById('reg-phone').value,
        parent_name: document.getElementById('reg-pname').value,
        parent_phone: document.getElementById('reg-pphone').value,
        relationship: document.getElementById('reg-prel').value,
        photo_url: photoUrl,
        portfolio: { learnHours: 0, activityHours: 0, contests: 0, skills: 0, milestones: [] }
      };

      const { error } = await supabase.from('members').insert([newMember]);
      showLoading(false);

      if (error) {
        alert('註冊失敗：' + error.message);
      } else {
        alert('註冊成功！請等待管理員審批後再登入。');
        switchView('login-view');
      }
    }

    // ===== 4. 活動值日排班與載入 =====
    async function loadDuties() {
      showLoading(true);
      const { data, error } = await supabase.from('activity_duties').select('*').order('duty_date', { ascending: false });
      showLoading(false);

      const tbody = document.getElementById('duty-tbody');
      tbody.innerHTML = '';

      if (data && data.length > 0) {
        data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.duty_date}</td>
              <td>${item.activity_name}</td>
              <td>${item.leader}</td>
              <td>${item.cam1}, ${item.cam2 || '-'}, ${item.cam3 || '-'}</td>
              <td>${item.editor}</td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">暫無排班資料</td></tr>';
      }
    }

    // ===== 5. 器材借用 =====
    async function loadBorrows() {
      showLoading(true);
      const { data, error } = await supabase.from('equipment_borrows').select('*').order('timestamp', { ascending: false });
      showLoading(false);

      const tbody = document.getElementById('borrowRecordsBody');
      tbody.innerHTML = '';
      if (data) {
        data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.name}</td>
              <td>${item.class_name}</td>
              <td>${item.equipment}</td>
              <td>${item.borrow_date}</td>
              <td>${item.duration} 小時</td>
            </tr>
          `;
        });
      }
    }

    // ===== 6. 管理員審核與控制台 =====
    async function loadAdminPanel() {
      if (!currentUser || currentUser.role !== 'admin') {
        alert('無權限存取！請登入管理員帳號。');
        return;
      }
      showLoading(true);
      const { data, error } = await supabase.from('members').select('*');
      showLoading(false);

      const tbody = document.getElementById('admin-tbody');
      tbody.innerHTML = '';
      if (data) {
        data.forEach(m => {
          tbody.innerHTML += `
            <tr>
              <td>${m.student_id}</td>
              <td>${m.name}</td>
              <td>${m.class_name}</td>
              <td><span class="badge bg-${m.role === 'admin' ? 'danger' : m.role === 'member' ? 'success' : 'warning'}">${m.role}</span></td>
              <td>
                ${m.role === 'pending' ? `<button class="btn btn-sm btn-success" onclick="approveMember('${m.student_id}')">通過</button>` : ''}
              </td>
            </tr>
          `;
        });
      }
    }

    async function approveMember(studentId) {
      showLoading(true);
      const { error } = await supabase.from('members').update({ role: 'member' }).eq('student_id', studentId);
      showLoading(false);
      if (!error) {
        alert('審核成功！');
        loadAdminPanel();
      }
    }

    // ===== 7. 請假申請 =====
    async function handleLeaveSubmit(e) {
      e.preventDefault();
      if (!currentUser) {
        alert('請先登入！');
        return;
      }
      showLoading(true);
      const req = {
        member_name: currentUser.name,
        class_id: currentUser.class_name,
        leave_type: document.getElementById('leave-type').value,
        reason: document.getElementById('leave-reason').value
      };
      const { error } = await supabase.from('leave_requests').insert([req]);
      showLoading(false);
      if (!error) {
        alert('請假單已提交成功！');
      }
    }
  </script>
</body>
</html>
